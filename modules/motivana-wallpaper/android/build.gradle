plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'org.haina2410.motivana'
version = '0.1.0'

android {
  // Analyze this module's source without traversing the known-broken third-party Worklets lint project.
  lint {
    checkDependencies false
  }
  namespace 'org.haina2410.motivana.wallpaper'
  defaultConfig {
    versionCode 1
    versionName '0.1.0'
    testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
  }
  sourceSets {
    main.assets.srcDirs += "${project.rootDir}/../assets"
  }
}

dependencies {
  implementation 'androidx.work:work-runtime-ktx:2.10.3'
  testImplementation 'junit:junit:4.13.2'
  testImplementation 'androidx.work:work-testing:2.10.3'
  testImplementation 'androidx.test:core:1.6.1'
  testImplementation 'org.robolectric:robolectric:4.16'
  androidTestImplementation 'androidx.test:runner:1.6.2'
  androidTestImplementation 'androidx.test.ext:junit:1.2.1'
}
